;=======================================================================
; GameServer Auto-Update Configuration
;=======================================================================
; This file controls the automatic update system for your GameServer.
; Configure the update server URL and behavior settings below.
;=======================================================================

[UpdateManager]
;-----------------------------------------------------------------------
; Enabled: Enable/Disable the auto-update system
;   0 = Disabled (no automatic updates)
;   1 = Enabled (check for updates automatically)
;-----------------------------------------------------------------------
Enabled = 1

;-----------------------------------------------------------------------
; AutoCheck: Automatically check for updates periodically
;   0 = Disabled (only manual checks via menu)
;   1 = Enabled (check every hour automatically)
;-----------------------------------------------------------------------
AutoCheck = 1

;-----------------------------------------------------------------------
; AutoDownload: Automatically download updates when available
;   0 = Disabled (user must manually download)
;   1 = Enabled (download automatically after detection)
;   
; NOTE: Updates are NEVER applied automatically - you must manually
;       apply them via the menu for safety.
;-----------------------------------------------------------------------
AutoDownload = 0

;-----------------------------------------------------------------------
; ShowNotifications: Show popup notifications for updates
;   0 = Disabled (only log to console)
;   1 = Enabled (show message boxes for important events)
;-----------------------------------------------------------------------
ShowNotifications = 1

;-----------------------------------------------------------------------
; UpdateServerUrl: URL of your web server hosting the updates
;   Example: http://yourwebsite.com/gameserver/updates
;   
; IMPORTANT: This directory must contain:
;   1. update_manifest.txt - Update information file
;   2. GameServer_X.X.X.exe - Updated executable files
;   3. Any data files you want to distribute (Item.txt, etc.)
;-----------------------------------------------------------------------
UpdateServerUrl = http://yourwebsite.com/gameserver/updates

;-----------------------------------------------------------------------
; CurrentVersion: Your current GameServer version
;   Format: Major.Minor.Patch (e.g., 1.0.0, 1.2.5, etc.)
;   This is compared against the version in update_manifest.txt
;-----------------------------------------------------------------------
CurrentVersion = 1.0.0

;-----------------------------------------------------------------------
; TempDirectory: Local directory for downloading update files
;   Updates are downloaded here before being applied
;-----------------------------------------------------------------------
TempDirectory = .\Update\Temp

;=======================================================================
; USAGE INSTRUCTIONS:
;=======================================================================
; 
; 1. SET UP YOUR WEB SERVER:
;    - Upload the update_manifest.txt file (see example below)
;    - Upload your new GameServer.exe or data files
;    - Ensure the UpdateServerUrl points to the correct location
;
; 2. ENABLE AUTO-UPDATE:
;    - Set Enabled = 1 above
;    - Configure AutoCheck and AutoDownload as desired
;    - Restart your GameServer
;
; 3. CHECKING FOR UPDATES:
;    - Automatic: If AutoCheck=1, checks every hour
;    - Manual: Use menu [Update] -> [Check for Updates]
;
; 4. APPLYING UPDATES:
;    - For EXECUTABLE updates: Server will restart automatically
;    - For DATA files: May require manual reload via menu
;
; 5. SELECTIVE UPDATES:
;    - Each GameServer instance can have its own config
;    - Disable auto-update on specific servers by setting Enabled=0
;
;=======================================================================
